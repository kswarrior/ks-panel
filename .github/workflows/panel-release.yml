name: Release Panel Binary

on:
  push:
    branches:
      - main
    paths:
      - 'panel/**'
      - 'build.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build KS Panel Binary
        run: ./build.sh

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(jq -r .version panel/node/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Archive
        run: |
          cd release/kspanel
          tar -cJf ../../panel.tar.xz .

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            gh release create "$VERSION" --title "Release $VERSION" --notes "Standalone binary release for KS Panel version $VERSION."
          fi
          gh release upload "$VERSION" panel.tar.xz --clobber
