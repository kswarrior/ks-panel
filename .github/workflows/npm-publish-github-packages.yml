name: Rename panel/node to panel/panel

on:
  workflow_dispatch: # Allows manual triggering from the GitHub UI

permissions:
  contents: write # Required to commit and push changes back to the repo

jobs:
  rename-folder:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Perform the rename safely
      - name: Rename panel/node to panel/panel
        run: |
          # Check if the source directory panel/node exists
          if [ -d "panel/node" ]; then
            # Create a temporary folder to avoid conflicts during the move
            mkdir -p temp_node
            
            # Move all contents (including hidden files) from panel/node to the temp folder
            mv panel/node/* temp_node/ 2>/dev/null || true
            mv panel/node/.* temp_node/ 2>/dev/null || true
            
            # Remove the empty panel/node folder
            rm -rf panel/node
            
            # Create the exact target directory: panel/panel
            mkdir -p panel/panel
            
            # Move contents from the temp folder into panel/panel
            mv temp_node/* panel/panel/ 2>/dev/null || true
            mv temp_node/.* panel/panel/ 2>/dev/null || true
            
            # Clean up the temporary folder
            rm -rf temp_node
            
            echo "Successfully moved contents from panel/node to panel/panel"
          else
            echo "Error: 'panel/node' directory not found!"
            exit 1
          fi

      # Step 3: Commit and push the changes
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the new folder and the deletion of the old folder
          git add panel/panel/
          git rm -r panel/node/ 2>/dev/null || true
          
          # Only commit if changes are present
          if git diff-index --quiet HEAD --; then
            echo "No changes detected to commit."
          else
            git commit -m "Automated refactor: Renamed panel/node to panel/panel"
            git push
          fi
