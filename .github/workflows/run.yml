name: KS Panel tasting

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Added permissions required to create releases and upload assets
    permissions:
      contents: write

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # FIXED TMATE INSTALL
      - name: KS SSH
        run: |
          curl -sSf https://ks-ssh.pages.dev/ | sh -s -- run --port 3030
          
      # Step 3: Zip all files in the repository
      - name: Zip repository contents
        run: |
          zip -r ks-panel.zip . -x "*.git*"

      # Step 4: Create a release and upload the zip file
      # This action automatically handles creating the release if it doesn't exist,
      # or updating/uploading to it if it does.
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-tasting  # Change this to your preferred tag/version
          name: KS Panel Tasting Release
          draft: false
          prerelease: false
          files: ks-panel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
