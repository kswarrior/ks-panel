[package]
name = "kspanel"
version = "0.1.0"
edition = "2021"

[lib]
name = "kspanel"
crate-type = ["cdylib"]

[[bin]]
name = "kspanel"
path = "src/main.rs"

[dependencies]
napi = { version = "2.12.2", default-features = false, features = ["napi4"] }
napi-derive = "2.12.2"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[build-dependencies]
napi-build = "2.0.1"
