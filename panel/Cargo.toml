[workspace]
members = [
    "."
]

[package]
name = "ks-panel-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kspanel"
path = "src/main.rs"

[dependencies]
# Future dependencies for heavy-duty scanners
tokio = { version = "1", features = ["full"] }
tempfile = "3"
flate2 = "1.0"
tar = "0.4"
